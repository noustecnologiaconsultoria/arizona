<style>
  * { box-sizing: border-box; font-family: "Segoe UI", Arial, sans-serif; }

  body {
    margin: 0;
    padding: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #004d40, #00796b);
    display: flex;
    flex-direction: column;
    align-items: center;
    color: #fff;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-top: 56px;
    margin-bottom: 26px;
    flex-wrap: wrap;
    text-align: center;
  }

  header img {
    height: 64px;
    width: auto;
    object-fit: contain;
  }

  header h1 {
    font-size: 2rem;
    font-weight: 600;
    letter-spacing: 0.5px;
    margin: 0;
  }

  /* ====== LAYOUT GERAL (3 BLOCOS) ====== */
  .wrap {
    width: min(1240px, 92vw);
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding-bottom: 20px;
  }

  .panel {
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 18px;
    padding: 18px;
    box-shadow: 0 10px 22px rgba(0, 0, 0, 0.16);
  }

  .panel-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
    padding-bottom: 10px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  }

  .panel-title {
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: 0.3px;
    margin: 0;
    opacity: 0.95;
  }

  .panel-sub {
    font-size: 0.9rem;
    margin: 0;
    opacity: 0.75;
    white-space: nowrap;
  }

  /* ====== GRIDS ====== */
  .grid {
    display: grid;
    gap: 14px;
  }

  /* Modelação: 1 card grande */
  .grid-modelacao {
    grid-template-columns: 1fr;
  }

  /* Acabamentos: 6 cards na MESMA LINHA */
  .grid-acabamentos {
    grid-template-columns: repeat(6, minmax(150px, 1fr));
  }

  /* Injetoras: 4 cards na MESMA LINHA */
  .grid-injetoras {
    grid-template-columns: repeat(4, minmax(170px, 1fr));
  }

  /* Em telas menores: manter 1 linha com scroll horizontal (sem quebrar) */
  .scroll-x {
    overflow-x: auto;
    padding-bottom: 6px; /* espaço pro scroll */
    -webkit-overflow-scrolling: touch;
  }
  .scroll-x::-webkit-scrollbar { height: 10px; }
  .scroll-x::-webkit-scrollbar-thumb {
    background: rgba(255,255,255,0.18);
    border-radius: 999px;
  }
  .scroll-x::-webkit-scrollbar-track { background: transparent; }

  /* ====== CARDS ====== */
  .card {
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: #fff;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    padding: 22px 14px;
    transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.14);
    cursor: pointer;
    user-select: none;
    min-height: 74px;
  }

  .card:hover {
    transform: translateY(-4px);
    background: rgba(255, 255, 255, 0.18);
    box-shadow: 0 10px 18px rgba(0, 0, 0, 0.22);
  }

  .card h2 {
    font-size: 1.05rem;
    margin: 0;
    font-weight: 600;
    letter-spacing: 0.2px;
    text-align: center;
  }

  /* Modelação com destaque */
  .card.card-primary {
    padding: 28px 16px;
    min-height: 86px;
  }
  .card.card-primary h2 {
    font-size: 1.15rem;
  }

  /* Footer sempre no rodapé */
  .footer {
    margin-top: auto;
    padding: 18px 0 22px;
    font-size: 0.9rem;
    opacity: 0.8;
    text-align: center;
    width: 100%;
  }

  @media (max-width: 900px) {
    header h1 { font-size: 1.7rem; }
    header img { height: 56px; }

    /* Em telas menores, os grids ainda ficam em 1 linha (com scroll) */
    .grid-acabamentos { grid-template-columns: repeat(6, minmax(145px, 1fr)); }
    .grid-injetoras   { grid-template-columns: repeat(4, minmax(160px, 1fr)); }
  }

  @media (max-width: 600px) {
    header { margin-top: 42px; margin-bottom: 18px; }
    header h1 { font-size: 1.45rem; }
    header img { height: 52px; }

    .wrap { width: 92vw; }
    .panel { padding: 16px; }
    .panel-sub { display: none; } /* limpa o cabeçalho no celular */
  }
</style>
